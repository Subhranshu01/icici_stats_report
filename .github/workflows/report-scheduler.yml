# Inside .github/workflows/daily-report.yml
name: Send Daily Dynatrace Report

on:
  schedule:
    - cron: '35 18 * * *'
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code from main branch
        uses: actions/checkout@v3
        with:
          ref: main  # Pulls your code with test.py or dynatrace_report.py

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas openpyxl requests

      - name: Restore reports branch workbook
        run: |
          git fetch origin reports
          git checkout origin/reports -- "Product Category wise Internal APIs Performance Report.xlsx" || echo "⚠️ No previous workbook — starting fresh"
      - name: Check contents after checkout
        run: ls -lh "Product Category wise Internal APIs Performance Report.xlsx" || echo "❌ Workbook not found"
        
 


      - name: Run your script
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          LOGINCONTROLLER_URL: ${{ secrets.LOGINCONTROLLER_URL }}
          MOTORINSURANCE_URL: ${{ secrets.MOTORINSURANCE_URL }}
          CREDITTRACK_URL: ${{ secrets.CREDITTRACK_URL }}
          DIGIGOLD_URL: ${{ secrets.DIGIGOLD_URL }}
          HEALTHINSURANCE_URL: ${{ secrets.HEALTHINSURANCE_URL }}
          LRREWARDS_URL: ${{ secrets.LRREWARDS_URL }}
          PERSONALLOAN_URL: ${{ secrets.PERSONALLOAN_URL }}
          MUTUALFUND_URL: ${{ secrets.MUTUALFUND_URL }}
          FIXEDDEPOSIT_URL: ${{ secrets.FIXEDDEPOSIT_URL }}
          BLOAN_URL: ${{ secrets.BLOAN_URL }}
          TERM_URL: ${{ secrets.TERM_URL }}
          STOCKS_URL: ${{ secrets.STOCKS_URL }}
          GOLD_URL: ${{ secrets.GOLD_URL }}
          HOMELOAN_URL: ${{ secrets.HOMELOAN_URL }}
          PORTFOLIO_URL: ${{ secrets.PORTFOLIO_URL }}
          SPENDTRACK_URL: ${{ secrets.SPENDTRACK_URL }}
          
        run: python test.py  # or python dynatrace_report.py

      - name: Commit updated workbook to reports branch
        run: |
          git checkout -b reports
          git add "Product Category wise Internal APIs Performance Report.xlsx"
          git commit -m "📊 Update workbook for $(date +'%Y-%m-%d')" || echo "Nothing to commit"
          git push origin reports --force
